# sprinklerpi: Raspberry Pi 1 with a 74HC595 shift-register valve board
# (BCM 22/27/4/17) and one normally-open rain sensor on BCM 14.
# Installed on the Pi as /etc/sprinkler/sprinkler.toml.
#
# For a dry run without switching valves, use driver = "sim" and
# [inputs.rain] sim = true.
listen = ":80"
db     = "/var/lib/sprinkler/sprinkler.db"

[outputs]
driver = "shiftreg"
chip   = "gpiochip0"
count  = 8

[outputs.shiftreg]
latch = 22
data  = 27
clock = 4
oe    = 17

[inputs.rain]
sim      = false
pin      = 14
normally = "open"

# HTTPS with a local CA kept in /var/lib/sprinkler/tls. The certificate
# covers the hostname, hostname.local and the Pi's current IP addresses;
# phones trust it after installing http://192.168.1.20/ca.crt once.
[tls]
listen = ":443"
