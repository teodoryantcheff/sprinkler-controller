# sprinklerpi: Raspberry Pi 1 with a 74HC595 shift-register valve board
# (GPIO 22/27/4/17) and one normally-open rain sensor on GPIO 14.
# Installed on the Pi as /etc/sprinkler/sprinkler.toml.
#
# Pin values are BCM GPIO numbers (= gpiochip0 line offsets), not physical
# header pins. The comments give the header pin of each one.
#
# For a dry run without switching valves, use driver = "sim" and
# [inputs.rain] sim = true.
listen = ":80"
db     = "/var/lib/sprinkler/sprinkler.db"

[outputs]
driver = "shiftreg"
chip   = "gpiochip0"
count  = 8

[outputs.shiftreg]
latch = 22   # GPIO22, header pin 15
data  = 27   # GPIO27, header pin 13
clock = 4    # GPIO4,  header pin 7
oe    = 17   # GPIO17, header pin 11 (active low)

[inputs.rain]
sim      = false
pin      = 14   # GPIO14, header pin 8
normally = "open"

# HTTPS is off: there is no built-in CA. To serve it, give a certificate
# for a name the browser opens (no public CA signs a LAN IP):
# [tls]
# listen = ":443"
# cert   = "/etc/sprinkler/tls/fullchain.pem"
# key    = "/etc/sprinkler/tls/privkey.pem"
